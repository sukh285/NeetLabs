<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Meta Description (SEO) -->
    <meta name="description" content="NeetLabs is an all-in-one tech interview prep platform. Practice coding challenges, system design, and behavioral questions to ace your next job interview." />

    <!-- Keywords -->
    <meta name="keywords" content="tech interview prep, coding platform, leetcode alternative, system design, mock interviews, job prep" />

    <!-- Application Name -->
    <meta name="application-name" content="NeetLabs" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://neetlabs.in/" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "NeetLabs",
      "url": "https://neetlabs.in",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "All",
      "description": "NeetLabs is a tech interview preparation platform that offers coding challenges, system design questions, and behavioral interview practice.",
      "creator": {
        "@type": "Organization",
        "name": "NeetLabs"
      }
    }
    </script>

    <!-- Font Loading Optimization -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Limelight&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/fv1.png" />

    <!-- Razorpay Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Preload 3D Scenes -->

      rel="preload"
      as="fetch"
      href="https://prod.spline.design/eSEqwFRABGogOiq8/scene.splinecode"
      crossorigin="anonymous"
    />

    <!-- Title -->
    <title>NeetLabs | Crack Your Next Tech Interview</title>
  </head>
